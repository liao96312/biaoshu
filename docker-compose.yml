services:
  web:
    build:
      context: ./web
    ports:
      - "5173:80"
    depends_on:
      - api

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      BID_AGENT_TASK_QUEUE: celery
      BID_AGENT_TOKEN: ${BID_AGENT_TOKEN:-}
      BID_AGENT_API_KEYS: ${BID_AGENT_API_KEYS:-}
      DATABASE_URL: postgresql://bid_agent:bid_agent@postgres:5432/bid_agent
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ./storage:/app/storage
    depends_on:
      - postgres
      - redis
      - qdrant
      - minio

  worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    environment:
      BID_AGENT_TASK_QUEUE: celery
      DATABASE_URL: postgresql://bid_agent:bid_agent@postgres:5432/bid_agent
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - ./storage:/app/storage
    depends_on:
      - redis
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bid_agent
      POSTGRES_USER: bid_agent
      POSTGRES_PASSWORD: bid_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
